<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — C2C Resume</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bg-glow {
            position: fixed;
            width: 400px; height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }
        .glow-1 { top: -100px; left: -100px; background: #3b82f6; }
        .glow-2 { bottom: -150px; right: -100px; background: #1152d4; }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }
        .icon-circle {
            width: 100px; height: 100px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(17,82,212,0.1));
            border: 2px solid rgba(59,130,246,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-ring 3s ease-in-out infinite;
        }
        .icon-circle svg {
            width: 44px; height: 44px;
            stroke: #60a5fa;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #e2e8f0, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1152d4, #3b82f6);
            color: white;
            box-shadow: 0 4px 20px rgba(17,82,212,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(17,82,212,0.4);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary svg {
            width: 18px; height: 18px;
            stroke: white; fill: none;
            stroke-width: 2;
        }
        .status-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2.5rem;
        }
        .status-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #334155;
        }
        .status-dots span.active { background: #3b82f6; }
        .brand {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.15); }
            50% { box-shadow: 0 0 0 20px rgba(59,130,246,0); }
        }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="container">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Some features may not be available right now.</p>
        <button class="btn btn-primary" onclick="window.location.reload()">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Try Again
        </button>
        <div class="status-dots">
            <span></span>
            <span class="active"></span>
            <span></span>
        </div>
        <div class="brand">C2C Resume Platform • MNIT Jaipur</div>
    </div>
</body>
</html>
